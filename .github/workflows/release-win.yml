name: Release Windows

# The Windows installer is built here because node-pty's terminal module is
# installed per system (see scripts/package-target.mjs): the artifact must come
# from a Windows machine. This makes that machine a runner. Dispatched by hand;
# packaging advances the patch version by one (scripts/bump-version.mjs), the
# release tag and title follow the version the build produced.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (untick for a build-only dry run)"
        type: boolean
        default: true

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package (runtimes + soundfont are fetched and hash-verified)
        # The check that the bundled runtime names no machine compares against
        # os.homedir(); on GitHub's runners that home (C:\Users\runneradmin) is
        # also baked into the official numpy wheel by its own CI, so the guard
        # would flag the vendor's own bytes. A neutral home for this step keeps
        # the guard pointed at the real staging and pip-cache paths.
        env:
          USERPROFILE: D:\cihome
          HOME: D:\cihome
          LOCALAPPDATA: D:\cihome\AppData\Local
          APPDATA: D:\cihome\AppData\Roaming
        run: npm run package:win

      - name: Read the version the build produced
        id: ver
        shell: bash
        run: echo "v=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCode-${{ steps.ver.outputs.v }}-x64
          path: |
            dist/MCode-${{ steps.ver.outputs.v }}-x64.exe
            dist/MCode-${{ steps.ver.outputs.v }}-x64.exe.blockmap
            dist/latest.yml

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          V="${{ steps.ver.outputs.v }}"
          gh release create "v$V" \
            "dist/MCode-$V-x64.exe" \
            "dist/MCode-$V-x64.exe.blockmap" \
            "dist/latest.yml" \
            --title "MCode $V"
