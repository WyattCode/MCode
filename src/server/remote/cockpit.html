<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCode 驾驶舱</title>
<style>
  :root {
    --bg: #101214; --panel: #17191c; --panel2: #1d2024; --line: #2a2e33;
    --fg: #e8eaed; --muted: #9aa0a6; --accent: #6ea8fe; --ok: #4ade80;
    --warn: #fbbf24; --err: #f87171; --user: #233246;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); flex: none; }
  #dot.on { background: var(--ok); }
  header select {
    flex: 1; min-width: 0; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit;
  }
  header button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .panes { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
  @media (min-width: 1000px) { .panes { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } .panes > #detail { display: block; } }
  #timeline { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #detail { display: none; overflow-y: auto; padding: 14px; border-left: 1px solid var(--line); background: var(--panel); }
  .msg { border-radius: 10px; padding: 8px 12px; max-width: 100%; word-break: break-word; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .msg.assistant { background: var(--panel2); align-self: stretch; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg pre { white-space: pre-wrap; font: inherit; }
  .toolrow { font-size: 12px; color: var(--muted); padding: 4px 12px; border-left: 2px solid var(--line); }
  .toolrow b { color: var(--fg); font-weight: 500; }
  .pcard { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; background: #241f0e; }
  /*
   * A question is a different kind of stop from a permission: the turn needs a
   * decision rather than an approval, and it is not a security boundary. Drawn
   * in the accent rather than the warning colour, so the two are told apart at
   * a glance on a phone.
   */
  .pcard.qcard { border-color: var(--accent); background: #101a2b; }
  .pcard .t { font-weight: 500; margin-bottom: 4px; }
  .pcard .d { font-size: 12px; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
  /* A question's own text, above its options: read at body size, not as a caption. */
  .pcard .qtext { font-size: 13px; color: var(--fg); margin: 2px 0 6px; overflow-wrap: anywhere; }
  .pcard .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  /*
   * A phone is the narrow case, and three option labels on one line were
   * squeezed to a few characters each - or overflowed their button. They wrap
   * instead, and a long label gets the whole row rather than a share of it.
   */
  .pcard button { flex: 1 1 auto; min-width: 88px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); font: inherit; cursor: pointer; overflow-wrap: anywhere; }
  .pcard .allow { background: #17351f; border-color: var(--ok); }
  .pcard .reject { background: #3a1a1a; border-color: var(--err); }
  .errline { color: var(--err); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; }
  footer { display: flex; gap: 8px; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); flex: none; }
  #input { flex: 1; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; resize: none; min-height: 44px; max-height: 140px; }
  footer button { padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--accent); color: #0b1220; font: inherit; font-weight: 500; cursor: pointer; }
  footer button:disabled { opacity: 0.4; cursor: default; }
  #stop { background: var(--panel2); color: var(--err); }
  #connect { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; z-index: 10; }
  #connect h1 { font-size: 18px; font-weight: 500; }
  #connect input { width: min(420px, 100%); background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  #connect button { width: min(420px, 100%); padding: 12px; border-radius: 10px; border: 0; background: var(--accent); color: #0b1220; font: inherit; font-weight: 500; cursor: pointer; }
  #connect .hint { max-width: 420px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h2 class="sr">MCode 远程驾驶舱：会话时间线、diff 与权限批准</h2>
<div id="connect">
  <h1>MCode 驾驶舱</h1>
  <input id="c-url" placeholder="ws://192.168.x.x:端口" autocapitalize="off" spellcheck="false">
  <input id="c-token" placeholder="配对令牌（storage/remote-token.json）" autocapitalize="off" spellcheck="false">
  <button id="c-go">连接</button>
  <p class="hint">与电脑同一网络。地址和令牌只保存在本机浏览器，令牌不进入网址。</p>
</div>

<header>
  <span id="dot" title="连接状态"></span>
  <select id="sessions"></select>
  <button id="new">新会话</button>
</header>
<div class="panes">
  <div id="timeline"><p class="hint">连接后这里显示实时消息流</p><p class="hint" id="busy" style="display:none">正在回答…</p></div>
  <aside id="detail"><p class="hint">选中消息的详情与 diff 显示在这里</p></div>
</div>
<footer>
  <textarea id="input" rows="1" placeholder="给本机的 MCode 发指令…"></textarea>
  <button id="stop" title="中断当前任务">停止</button>
  <button id="send">发送</button>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { ws: null, cursor: 0, sessions: {}, current: null, pending: {}, requestId: 0, titles: {}, listReq: null, questionReq: null, retries: 0 };
const saveCfg = (url, token) => localStorage.setItem("mcode-remote", JSON.stringify({ url, token }));
const loadCfg = () => { try { return JSON.parse(localStorage.getItem("mcode-remote") || "{}"); } catch { return {}; } };

function frame(frame) { state.ws.send(JSON.stringify(frame)); }
function request(request) {
  const id = "r" + ++state.requestId;
  frame({ kind: "request", id, request });
  return id;
}

function connect(url, token) {
  /*
   * One socket at a time.
   *
   * The page reconnects itself from a saved address on load, and the connect
   * button reconnects too. Pressing it after the automatic attempt - or twice
   * quickly - used to leave two sockets open, both feeding one timeline: every
   * message drawn twice, every fragment appended to a line that had already
   * taken it. Closing the old one first is what makes the button idempotent.
   */
  if (state.ws) {
    const previous = state.ws;
    state.ws = null;
    try {
      previous.onclose = null;
      previous.close();
    } catch {}
  }
  state.ws = new WebSocket(url, ["mcode", "mcode.remote." + token]);
  state.ws.onopen = () => {
    $("dot").classList.add("on");
    state.retries = 0;
    state.listReq = request({ type: "session.list" });
    /*
     * Parked questions are replayed, as the window replays them: `question.asked`
     * is published once, so a phone that connected after the model asked - or
     * whose socket dropped and came back - would show a busy conversation with
     * nothing to press until the question timed out.
     */
    state.questionReq = request({ type: "question.list" });
  };
  state.ws.onclose = () => {
    $("dot").classList.remove("on");
    // Back off: 2.5s, 5s, 10s … capped at 60s, so a wrong token cannot hammer the host forever.
    const delay = Math.min(2500 * Math.pow(2, state.retries || 0), 60000);
    state.retries = (state.retries || 0) + 1;
    /*
     * One pending retry, not one per drop. A socket that fails repeatedly would
     * otherwise stack a timer each time, and the page would reconnect several
     * times over - the same double-delivery the connect button used to cause,
     * arriving from the other direction.
     */
    if (state.retry) clearTimeout(state.retry);
    state.retry = setTimeout(() => {
      state.retry = null;
      connect(url, token);
    }, delay);
  };
  state.ws.onerror = () => {};
  state.ws.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch {} };
}

function handle(f) {
  if (f.kind === "remote.welcome") { state.cursor = f.eventId; frame({ kind: "remote.resume", cursor: f.eventId }); return; }
  if (f.kind === "response") {
    const pending = state.pending[f.id];
    if (pending) { delete state.pending[f.id]; pending(f); }
    if (f.id === state.listReq && f.ok) renderSessions(f.data.sessions || [], f.data.running || []);
    if (f.id === state.questionReq && f.ok) {
      /*
       * A replayed question may already be on screen - the event arrived before
       * this answer did - and adding it twice would leave two cards whose
       * answers race. `addQuestionCard` returns early when its id is taken.
       */
      for (const question of f.data.questions || []) addQuestionCard(question);
    }
    if (!f.ok) addLine("errline", "命令失败：" + (f.error || "未知错误"));
    return;
  }
  if (f.kind === "remote.resync") { state.listReq = request({ type: "session.list" }); return; }
  if (f.kind !== "remote.event") return;
  state.cursor = Math.max(state.cursor, f.eventId);
  const e = f.event;
  if (e.type === "session.updated") { state.titles[e.session.id] = e.session.title || e.session.id; refreshSelect(); if (e.session.id === state.current) markBusy(false); }
  if (e.type === "session.idle") markBusy(false);
  if (e.type === "session.error") addLine("errline", e.error);
  if (e.type === "message.updated") upsertMessage(e.sessionID, e.message);
  if (e.type === "message.part.updated") upsertPart(e.sessionID, e.messageID, e.part);
  /*
   * The text itself arrives as `message.delta`, not in `part.updated`.
   *
   * `part.updated` is published once, when the part is created - with an empty
   * string - and then again at the end from `message.updated`. The deltas in
   * between are what a reader watches appear. Without this branch the cockpit
   * showed a blank conversation for the whole turn and then the finished reply
   * in one jump, which reads as a hang rather than as streaming.
   *
   * Each delta is a fragment (`part.text += text` in the runner), so they
   * accumulate per part rather than overwrite: keeping the last one would show
   * a single syllable.
   */
  if (e.type === "message.delta") appendDelta(e.sessionID, e.messageID, e.partID, e.text, e.at);
  if (e.type === "permission.requested") addPermissionCard(e.request);
  if (e.type === "permission.resolved") removePermissionCard(e.requestID);
  if (e.type === "question.asked") addQuestionCard(e.request);
  if (e.type === "question.replied" || e.type === "question.rejected") removeQuestionCard(e.requestID);
  if (e.type === "session.deleted") { delete state.titles[e.sessionID]; refreshSelect(); }
}

/*
 * Whether the conversation on screen is mid-turn.
 *
 * A phone shows "…" while the answer streams; without this the empty bubble of
 * a turn that has not produced a word yet is indistinguishable from a page that
 * failed. `session.idle` is the end, and sending a prompt is the beginning -
 * there is no "started" event to wait for.
 */
function markBusy(busy) {
  state.busy = busy;
  /*
   * The hint is rebuilt rather than looked up: `select()` and a gap refill both
   * empty the timeline, which takes it with them. Recreating it here means the
   * indicator survives a conversation switch instead of disappearing for good
   * the first time one happens.
   */
  let hint = document.getElementById("busy");
  if (!hint) {
    hint = document.createElement("p");
    hint.className = "hint";
    hint.id = "busy";
    hint.textContent = "正在回答…";
    $("timeline").appendChild(hint);
  }
  hint.style.display = busy ? "" : "none";
  if (!busy) return;
  scroll();
}

function renderSessions(sessions, running) {
  state.running = running;
  state.sessions = {};
  for (const s of sessions) state.titles[s.id] = s.title || s.id;
  refreshSelect(running);
  if (!state.current && sessions.length) select(sessions[sessions.length - 1].id);
}

function refreshSelect(running) {
  const sel = $("sessions");
  const current = state.current;
  sel.innerHTML = "";
  const ids = Object.keys(state.titles);
  for (const id of ids) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = (running && running.includes(id) ? "▶ " : "") + (state.titles[id] || id);
    sel.appendChild(opt);
  }
  if (current && ids.includes(current)) sel.value = current;
  sel.onchange = () => select(sel.value);
}

function select(id) {
  state.current = id;
  $("timeline").innerHTML = "";
  for (const key of Object.keys(messages)) delete messages[key];
  // The kinds go with the bubbles: a part id from another conversation would
  // decide how this one's fragments are drawn.
  for (const key of Object.keys(partKinds)) delete partKinds[key];
  for (const key of Object.keys(deltas)) delete deltas[key];
  if (!id) return;
  frame({ kind: "request", id: "w" + ++state.requestId, request: { type: "session.watch", sessionIDs: [id] } });
  // History first, then the live stream rides on top of it.
  const ticket = "h" + ++state.requestId;
  state.pending[ticket] = (res) => {
    if (!res.ok || !Array.isArray(res.data?.messages)) return;
    for (const m of res.data.messages) upsertMessage(id, m);
    scroll();
  };
  frame({ kind: "request", id: ticket, request: { type: "session.get", sessionID: id } });
  // A conversation that was already working when it was picked up keeps its
  // indicator: the turn was running before this page looked at it.
  markBusy((state.running || []).includes(id));
}

function bubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const who = document.createElement("div"); who.className = "who";
  who.textContent = role === "user" ? "你" : role === "assistant" ? "MCode" : role;
  const pre = document.createElement("pre"); pre.textContent = text;
  div.append(who, pre);
  $("timeline").appendChild(div);
  scroll();
  return div;
}
function addLine(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("timeline").appendChild(d); scroll(); }
function scroll() { const t = $("timeline"); t.scrollTop = t.scrollHeight; }

const messages = {};
// Fragments seen before their message existed, keyed `messageID|partID`.
const deltas = {};
// What kind of part each id is (text, reasoning, tool). A delta says only which
// part it belongs to, so without this the page cannot tell the reply from the
// thinking behind it - and would print both as the answer.
const partKinds = {};

/**
 * Read the conversation again after the stream lost something.
 *
 * Asking twice in a row would be two full transcripts for one gap, so a session
 * already waiting is left alone; the flag clears when the answer lands.
 */
const refilling = {};
function requestGapRefill(sessionID) {
  if (refilling[sessionID] || sessionID !== state.current) return;
  refilling[sessionID] = true;
  const ticket = "g" + ++state.requestId;
  state.pending[ticket] = (res) => {
    refilling[sessionID] = false;
    if (!res.ok || !Array.isArray(res.data?.messages)) return;
    if (sessionID !== state.current) return;
    // Rebuild from what disk says, fragments included: the gap is exactly the
    // part this page got wrong, so its own copy must not survive the repair.
    $("timeline").innerHTML = "";
    for (const key of Object.keys(messages)) delete messages[key];
    for (const key of Object.keys(deltas)) delete deltas[key];
    for (const key of Object.keys(partKinds)) delete partKinds[key];
    for (const m of res.data.messages) upsertMessage(sessionID, m);
    scroll();
  };
  frame({ kind: "request", id: ticket, request: { type: "session.get", sessionID } });
}

function renderText(entry) {
  // All text parts joined the same way upsertMessage laid them out, so a
  // streaming update to one part never erases its siblings.
  const pre = entry.el.querySelector("pre");
  const text = Object.values(entry.texts).join("\n");
  if (pre) pre.textContent = text || "…";
}

function upsertMessage(sessionID, message) {
  if (sessionID !== state.current) return;
  const existing = messages[message.id];
  if (existing) existing.el?.remove();
  const role = message.role || "assistant";
  const parts = message.parts || [];
  const texts = parts.filter((p) => p.type === "text").map((p) => p.text).join("\n");
  const el = bubble(role, texts || "…");
  const kept = {};
  let solo = "";
  for (const p of parts) {
    if (p.type !== "text") continue;
    if (p.id) kept[p.id] = p.text;
    else solo = solo ? solo + "\n" + p.text : p.text;
  }
  // An id-less text part must join `texts` too, or the next renderText rebuild
  // (from texts alone) would erase it.
  if (solo) kept.__solo = solo;
  // Which kind each part is, so a later delta knows whether its words are the
  // reply or the thinking behind it.
  for (const p of parts) if (p.id) partKinds[message.id + "|" + p.id] = p.type;
  /*
   * What each part holds now is the baseline its next fragment counts from.
   *
   * `at` on a fragment is the length the part had just before it, so the
   * accumulator must start where the part already is.
   *
   * Never *shorter* than what is already there - tested by length, not by
   * truthiness. `message.updated` arrives as soon as a part is announced, when
   * its text is still "", and an `!held` test let that empty string overwrite
   * fragments already applied. Every later fragment then began at zero against
   * an `at` that had moved on, the gap guard fired on all of them, and the
   * reply stalled - exactly what the trace showed: `at=3 held=0`, `at=9 held=0`.
   */
  for (const p of parts) {
    if (!p.id || typeof p.text !== "string") continue;
    const key = message.id + "|" + p.id;
    const held = deltas[key] || "";
    if (p.text.length >= held.length) deltas[key] = p.text;
  }
  // What is drawn: the accumulated text of the text parts, never reasoning -
  // the model did not say its thinking to the reader.
  for (const p of parts) {
    if (p.type !== "text" || !p.id) continue;
    kept[p.id] = deltas[message.id + "|" + p.id] || "";
  }
  messages[message.id] = { el, parts: {}, texts: kept };
  renderText(messages[message.id]);
  for (const part of parts) if (part.type === "tool") addToolRow(part);
}

function upsertPart(sessionID, messageID, part) {
  if (sessionID !== state.current) return;
  // The kind is recorded even for a message this page has not drawn yet: the
  // fragments that arrive before it are dropped, and this is what lets the
  // later ones be kept.
  if (part.id) partKinds[messageID + "|" + part.id] = part.type;
  if (!part.id) {
    // An id-less part has no accumulator; it is the whole text or nothing.
    const entry = messages[messageID];
    if (entry && part.type === "text") {
      entry.texts.__solo = part.text;
      renderText(entry);
    }
    if (part.type === "tool") addToolRow(part);
    return;
  }
  const key = messageID + "|" + part.id;
  /*
   * The part's text is a snapshot and the accumulator is the truth, so the
   * longer of the two wins. Overwriting with `part.text` outright set the line
   * back to "" each time a part was re-announced, and the next fragment then
   * measured against zero.
   */
  if (part.type === "text" && typeof part.text === "string") {
    const held = deltas[key] || "";
    if (part.text.length >= held.length) deltas[key] = part.text;
    const entry = messages[messageID];
    if (entry) {
      entry.texts[part.id] = deltas[key];
      renderText(entry);
    }
  }
  if (part.type === "tool") addToolRow(part);
}

/*
 * One fragment of a reply, appended to its part.
 *
 * Two things this has to get right, both of which the first version got wrong:
 *
 * `at` is the length the part had *before* this append (N11-32). A cockpit that
 * connected mid-step holds the copy written to disk, which lags by up to 500ms,
 * so appending blindly leaves a hole in the middle of a paragraph that nothing
 * closes until the part ends - minutes, on a long answer. A length that does not
 * line up means fragments were missed, so the transcript is read again instead.
 *
 * Reasoning streams through this same event. Drawing it as the answer would put
 * the model's thinking on screen as if it had said it.
 *
 * The message may not exist yet - a delta can beat the `message.updated` that
 * creates its bubble - so the accumulator is kept here and `upsertMessage` folds
 * it in when the bubble arrives.
 */
function appendDelta(sessionID, messageID, partID, text, at) {
  if (sessionID !== state.current) return;
  const part = partID || "__solo";
  const key = messageID + "|" + part;
  /*
   * Every fragment is accumulated, whatever kind of part it belongs to, and the
   * kind only decides whether it is drawn. Dropping the ones whose part has not
   * been announced yet would lose them for good - and then every later fragment
   * would fail the length check below, turning one unknown part into a re-read
   * loop.
   */
  const held = deltas[key] || "";
  if (typeof at === "number" && held.length !== at) {
    /*
     * N11-32: `at` is the length this part had before the append. A cockpit that
     * connected mid-step holds the copy written to disk, which lags by up to
     * 500ms, so appending onto it leaves a hole in the middle of the paragraph
     * that nothing closes until the part ends - minutes, on a long answer. The
     * transcript is read again instead of guessing where the hole is.
     */
    requestGapRefill(sessionID);
    return;
  }
  deltas[key] = held + text;
  if (partKinds[key] === "reasoning") return;
  const entry = messages[messageID];
  if (!entry) return;
  entry.texts[part] = deltas[key];
  renderText(entry);
}

function addToolRow(part) {
  const row = document.createElement("div");
  row.className = "toolrow";
  const name = part.name || part.tool || "tool";
  const status = part.state && part.state.status ? part.state.status : "";
  row.innerHTML = "<b></b> <span></span>";
  row.querySelector("b").textContent = name;
  row.querySelector("span").textContent = status;
  $("timeline").appendChild(row); scroll();
}

function addPermissionCard(asked) {
  const card = document.createElement("div");
  card.className = "pcard";
  card.id = "pc-" + asked.id;
  const t = document.createElement("div"); t.className = "t"; t.textContent = "权限请求：" + (asked.kind || "tool");
  const d = document.createElement("div"); d.className = "d";
  d.textContent = [asked.title, asked.meta && asked.meta.path, JSON.stringify(asked.input || "").slice(0, 200)].filter(Boolean).join(" · ");
  const btns = document.createElement("div"); btns.className = "btns";
  for (const [label, value, cls] of [["允许一次", "once", "allow"], ["总是允许", "always", "allow"], ["拒绝", "reject", "reject"]]) {
    const b = document.createElement("button");
    b.className = cls; b.textContent = label;
    b.onclick = () => { request({ type: "permission.respond", requestID: asked.id, response: value }); card.remove(); };
    btns.appendChild(b);
  }
  card.append(t, d, btns);
  $("timeline").appendChild(card); scroll();
}
function removePermissionCard(id) { const el = $("pc-" + id); if (el) el.remove(); }

/*
 * A question the turn is parked on. The window shows it as a card of options;
 * here it is the same card, one question at a time, because a phone has no
 * room for the whole form. Answering sends every answer in one reply - the
 * skipped ones empty - which is what the dock's own submit does.
 *
 * Without this a phone would show a busy conversation and nothing to press,
 * and the turn would sit until the question timed out.
 */
function addQuestionCard(asked) {
  if (!asked || !asked.questions || !asked.questions.length) return;
  // The event and the replay can both name the same question; one card answers it.
  if ($("qc-" + asked.id)) return;
  const card = document.createElement("div");
  card.className = "pcard qcard";
  card.id = "qc-" + asked.id;
  const t = document.createElement("div"); t.className = "t";
  t.textContent = asked.loop ? "重复调用确认" : "需要你的决定";
  card.appendChild(t);
  const answers = asked.questions.map(() => []);
  const send = () => { request({ type: "question.reply", requestID: asked.id, answers }); card.remove(); };

  asked.questions.forEach((q, qi) => {
    const label = document.createElement("div"); label.className = "qtext";
    label.textContent = q.question.slice(0, 240);
    card.appendChild(label);
    const btns = document.createElement("div"); btns.className = "btns";
    (q.options || []).slice(0, 3).forEach((option) => {
      const b = document.createElement("button");
      b.className = "allow"; b.textContent = option.label;
      b.onclick = () => {
        answers[qi] = [option.label];
        // Only this question's own buttons are cleared: one choice per question.
        btns.querySelectorAll("button").forEach((x) => x.classList.remove("allow"));
        b.classList.add("allow");
        // Answered or skipped everywhere - the dock submits in one reply, so this does too.
        if (answers.every((a) => a.length > 0)) send();
      };
      btns.appendChild(b);
    });
    card.appendChild(btns);
  });

  const skip = document.createElement("button");
  skip.className = "reject"; skip.textContent = "跳过（Unanswered）";
  skip.onclick = () => { request({ type: "question.reply", requestID: asked.id, answers: asked.questions.map(() => []) }); card.remove(); };
  // In a row of its own: `.pcard button` is `flex: 1` and only stretches inside
  // `.btns`, so a bare child would collapse to the width of its own label.
  const skipRow = document.createElement("div"); skipRow.className = "btns";
  skipRow.appendChild(skip);
  card.appendChild(skipRow);
  $("timeline").appendChild(card); scroll();
}
function removeQuestionCard(id) { const el = $("qc-" + id); if (el) el.remove(); }

$("c-go").onclick = () => {
  const url = $("c-url").value.trim() || (location.origin.replace(/^http/, "ws"));
  const token = $("c-token").value.trim();
  if (!url || !token) return;
  saveCfg(url, token);
  $("connect").style.display = "none";
  connect(url, token);
};
$("send").onclick = sendInput;
$("input").addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendInput(); } });
function sendInput() {
  const text = $("input").value.trim();
  if (!text || !state.current) return;
  // steer only joins a running turn; an idle session gets a plain prompt.
  const req = { type: "session.prompt", sessionID: state.current, text };
  if ((state.running || []).includes(state.current)) req.delivery = "steer";
  // From here until `session.idle`, the conversation is working on it. Without
  // this, a prompt that takes a few seconds to produce its first word looked
  // like a send that went nowhere.
  markBusy(true);
  request(req);
  $("input").value = "";
}
$("stop").onclick = () => { if (state.current) request({ type: "session.abort", sessionID: state.current }); };
// No title: the first prompt names the conversation, from its own first line
// and then from a model. Naming it here would make every session created from
// the cockpit identically titled, and the picker a list of duplicates.
$("new").onclick = () => request({ type: "session.create" });

(function boot() {
  const cfg = loadCfg();
  if (cfg.url && cfg.token) { $("c-url").value = cfg.url; $("c-token").value = cfg.token; $("connect").style.display = "none"; connect(cfg.url, cfg.token); }
})();
</script>
</body>
</html>
