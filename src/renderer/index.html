<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sockets may go anywhere; nothing else may.

      connect-src named ws://127.0.0.1:* alone, which meant the app could talk
      only to a backend on that literal address. Not ws://localhost - the same
      machine under its other name was refused - and no other machine at all, so
      the Servers dialog, the saved-server list and the stored server address
      were a feature that could not work, failing silently because a blocked
      socket looks exactly like a server that is not answering.

      Everything else stays shut. Scripts and styles are still 'self' only, so
      no page content can bring in code, and http/https are still not reachable
      from here - the one thing that needed them, the update feed, is fetched by
      the main process instead.

      Frames may show the main process's page preview server, which gives every
      served folder its own origin at http://<token>.localhost:<port> (loopback,
      as Chromium resolves any *.localhost name) - so one served page cannot
      read another's files. Media may play from data and blob addresses (an
      attached video), the preview server (a video file on disk) and the web (a
      video link in a reply) - only ever once the video preview has been opened
      by a press.

      Images may load from the web and from the preview server, as MiMo shows
      a reply's ![](https://...) picture and a picture on disk named by its
      path; blob addresses carry a picture being copied. An <img> cannot run
      script, and connect-src still keeps the web out of reach, so this opens no
      way for page code to send a request of its own.

      Requests may reach the preview server alone (http://*.localhost:*, which
      is loopback): MiMo's SVG file card reads a served .svg's text for its
      code tab, and that server answers other origins for .svg files only.

      Images may also load from mcode-media:, MiMo's cover proxy for a video
      card: the main process answers it only with a picture from a fixed list
      of platform image hosts (@shared/media-platform COVER_HOSTS), so this
      names one scheme, not the hosts behind it.

      Scripts may also compile WebAssembly ('wasm-unsafe-eval'): a reply's ABC
      score plays through FluidSynth's WebAssembly build, a file of the app's
      own under vendor/. The keyword allows WebAssembly compilation only - JS
      eval and new Function stay refused - and the soundfont it plays comes from
      the main process over IPC, so no host is added for it anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https: mcode-media:; font-src 'self' data:; connect-src 'self' ws: wss: http://*.localhost:*; frame-src 'self' http://*.localhost:*; media-src 'self' data: blob: http: https:"
    />
    <title>MCode</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
