org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
# No `org.gradle.java.home` here: this file is in version control, and an absolute
# path to one machine's JDK breaks the build on every other machine - and on this
# one after the SDK folder is rebuilt, which is exactly what happened (round 78).
# Gradle takes JAVA_HOME; `.workbuddy/build.py` exports it before it calls Gradle,
# and that is where a per-machine choice belongs.